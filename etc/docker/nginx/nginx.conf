worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Photographs from a phone are large.
    client_max_body_size 25M;

    # Behind the tunnel the visitor's connection is HTTPS but this hop is plain
    # HTTP, so $scheme says "http". cloudflared passes the real scheme along;
    # keep it if it is there, or Django decides the request was insecure and
    # rejects the admin login on CSRF.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~."    $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The read-only feed the site renders from.
        location /api/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Neida's admin.
        location /admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Admin's own CSS and JS, through WhiteNoise.
        location /static/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
        }

        # Uploaded photographs, straight off the volume rather than through
        # Python. Same origin as the site, so the API can return relative URLs.
        location /media/ {
            alias /app/media/;
            add_header Cache-Control "public, max-age=2592000";
        }

        # The site itself.
        location / {
            root /app/frontend;
            try_files $uri $uri/ /index.html;

            # Never cache the entry point, or a deploy goes unnoticed.
            location = /index.html {
                add_header Cache-Control "no-store";
            }

            # Everything else is content-hashed and safe to keep.
            location /_nuxt/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
}
